<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Access — Table & Co</title>
    
    <!-- Google Fonts: Inter (400, 500, 600, 700) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Auth Stylesheet -->
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="auth-page-wrapper">
        <main class="auth-card">
            
            <!-- Brand Header -->
            <header class="auth-header">
                <a href="../index.html" class="auth-logo" title="Back to Table & Co Home">Table & Co</a>
            </header>

            <!-- Login Form Section -->
            <section id="login-section" class="auth-section">
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to continue to your Table & Co experience.</p>

                <form id="login-form" novalidate>
                    <div id="login-global-error" class="form-error-global" role="alert"></div>

                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input 
                            type="email" 
                            id="login-email" 
                            name="email" 
                            placeholder="name@example.com" 
                            autocomplete="email"
                        >
                        <span id="login-email-error" class="error-msg"></span>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="login-password" 
                                name="password" 
                                placeholder="Enter your password" 
                                autocomplete="current-password"
                            >
                            <button 
                                type="button" 
                                class="btn-toggle-password" 
                                data-target="login-password" 
                                aria-label="Toggle password visibility"
                            >Show</button>
                        </div>
                        <span id="login-password-error" class="error-msg"></span>
                    </div>

                    <button type="submit" class="btn-submit" id="btn-login-submit">Log In</button>
                </form>

                <div class="auth-switch-text">
                    Don't have an account? 
                    <a href="#" id="switch-to-register" class="auth-switch-link">Create an account</a>
                </div>
            </section>

            <!-- Registration Form Section -->
            <section id="register-section" class="auth-section hidden">
                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join Table & Co to enjoy seamless dining and ordering.</p>

                <form id="register-form" novalidate>
                    <div id="register-global-error" class="form-error-global" role="alert"></div>

                    <div class="form-group">
                        <label for="register-name">Full Name</label>
                        <input 
                            type="text" 
                            id="register-name" 
                            name="name" 
                            placeholder="John Doe" 
                            autocomplete="name"
                        >
                        <span id="register-name-error" class="error-msg"></span>
                    </div>

                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input 
                            type="email" 
                            id="register-email" 
                            name="email" 
                            placeholder="name@example.com" 
                            autocomplete="email"
                        >
                        <span id="register-email-error" class="error-msg"></span>
                    </div>

                    <div class="form-group">
                        <label for="register-phone">Phone Number</label>
                        <input 
                            type="tel" 
                            id="register-phone" 
                            name="phone" 
                            placeholder="9876543210" 
                            autocomplete="tel"
                        >
                        <span id="register-phone-error" class="error-msg"></span>
                    </div>

                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="register-password" 
                                name="password" 
                                placeholder="Minimum 6 characters" 
                                autocomplete="new-password"
                            >
                            <button 
                                type="button" 
                                class="btn-toggle-password" 
                                data-target="register-password" 
                                aria-label="Toggle password visibility"
                            >Show</button>
                        </div>
                        <span id="register-password-error" class="error-msg"></span>
                    </div>

                    <div class="form-group">
                        <label for="register-confirm-password">Confirm Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="register-confirm-password" 
                                name="confirmPassword" 
                                placeholder="Re-enter your password" 
                                autocomplete="new-password"
                            >
                            <button 
                                type="button" 
                                class="btn-toggle-password" 
                                data-target="register-confirm-password" 
                                aria-label="Toggle confirm password visibility"
                            >Show</button>
                        </div>
                        <span id="register-confirm-password-error" class="error-msg"></span>
                    </div>

                    <button type="submit" class="btn-submit" id="btn-register-submit">Create Account</button>
                </form>

                <div class="auth-switch-text">
                    Already have an account? 
                    <a href="#" id="switch-to-login" class="auth-switch-link">Log in</a>
                </div>
            </section>

        </main>
    </div>

    <!-- JavaScript -->
    <script src="auth.js"></script>
</body>
</html>

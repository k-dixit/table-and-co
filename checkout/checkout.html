<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Table & Co | Burger District</title>

    <!-- Google Fonts: Inter (400, 500, 600, 700, 800) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Checkout Stylesheet -->
    <link rel="stylesheet" href="checkout.css">
    <link rel="stylesheet" href="../auth/auth.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="checkout-header">
        <nav class="checkout-navbar" aria-label="Checkout Navigation">
            <div class="navbar-left">
                <a href="../index.html" class="nav-brand-logo">Table & Co.</a>
            </div>

            <div class="navbar-center">
                <span class="nav-page-badge">Checkout</span>
            </div>

            <div class="navbar-right">
                <span class="nav-subbrand">BURGER DISTRICT</span>
                <div id="nav-auth-wrapper" style="display: inline-block; margin-left: 16px;"></div>
            </div>
        </nav>
    </header>

    <!-- Page Header Banner -->
    <div class="page-title-banner">
        <div class="banner-container">
            <h1 class="page-title">Checkout</h1>
            <p class="page-subtitle">Complete your order</p>
        </div>
    </div>

    <!-- Main Checkout Container -->
    <div class="checkout-layout-container">

        <!-- Left Column: Delivery Details Form -->
        <section class="delivery-section" aria-label="Delivery Details">
            <div class="form-card">
                <h2 class="section-title">Delivery Details</h2>

                <form class="delivery-form" id="delivery-form" novalidate onsubmit="return false;">

                    <!-- Full Name -->
                    <div class="form-group" id="group-fullName">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="John Doe" />
                        <span class="error-msg" id="error-fullName"></span>
                    </div>

                    <!-- Contact Info -->
                    <div class="form-row">
                        <div class="form-group" id="group-phone">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" />
                            <span class="error-msg" id="error-phone"></span>
                        </div>
                        <div class="form-group" id="group-email">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="john@example.com" />
                            <span class="error-msg" id="error-email"></span>
                        </div>
                    </div>

                    <!-- Delivery Address -->
                    <div class="form-group" id="group-address">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address" placeholder="Street Address, House / Plot No." />
                        <span class="error-msg" id="error-address"></span>
                    </div>

                    <!-- Apartment / Landmark (Optional) -->
                    <div class="form-group" id="group-landmark">
                        <label for="landmark">Apartment / Flat / Landmark</label>
                        <input type="text" id="landmark" name="landmark" placeholder="Apt #, Suite, Floor, or Landmark" />
                    </div>

                    <!-- City, State, Pincode -->
                    <div class="form-row form-row-three">
                        <div class="form-group" id="group-city">
                            <label for="city">City</label>
                            <input type="text" id="city" name="city" placeholder="Mumbai" />
                            <span class="error-msg" id="error-city"></span>
                        </div>
                        <div class="form-group" id="group-state">
                            <label for="state">State</label>
                            <input type="text" id="state" name="state" placeholder="Maharashtra" />
                            <span class="error-msg" id="error-state"></span>
                        </div>
                        <div class="form-group" id="group-pincode">
                            <label for="pincode">Pincode</label>
                            <input type="text" id="pincode" name="pincode" placeholder="400001" />
                            <span class="error-msg" id="error-pincode"></span>
                        </div>
                    </div>

                </form>
            </div>
        </section>

        <!-- Right Column: Order Summary Panel -->
        <aside class="summary-section" aria-label="Order Summary">
            <div class="summary-panel" id="summary-panel">
                <h2 class="summary-title">Order Summary</h2>

                <div class="summary-items-list" id="summary-items-list">
                </div>

                <hr class="summary-divider" />

                <div class="summary-breakdown">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="summary-subtotal">₹0</span>
                    </div>
                    <div class="summary-row">
                        <span>Delivery Fee</span>
                        <span id="summary-delivery">₹0</span>
                    </div>
                    <div class="summary-row">
                        <span>Taxes (10%)</span>
                        <span id="summary-tax">₹0</span>
                    </div>
                </div>

                <hr class="summary-divider" />

                <div class="summary-total-row">
                    <span class="total-label">Total</span>
                    <span class="total-amount" id="summary-total">₹0</span>
                </div>

                <button type="button" class="btn-place-order" id="btn-place-order">
                    <span>Place Order</span>
                    <span class="btn-arrow">&rarr;</span>
                </button>
            </div>
        </aside>

    </div>

    <!-- JavaScript Files -->
    <script src="../auth/auth.js"></script>
    <script src="../data/menu.js"></script>
    <script src="checkout.js"></script>
</body>

</html>
